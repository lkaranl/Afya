<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="100%" height="auto" style="shape-rendering:geometricPrecision; text-rendering:geometricPrecision;">
  <defs>
    <radialGradient id="nodeBlue" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>
    <radialGradient id="nodeGreen" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </radialGradient>
    <radialGradient id="nodeAmber" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </radialGradient>
    <radialGradient id="nodeRose" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </radialGradient>
    <filter id="glowNode" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#fbbf24" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#090e17" rx="14" stroke="#1e293b" stroke-width="1"/>

  <!-- ARESTAS / CONEXÕES REGULARES (CINZA SUAVE) -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="3 3" opacity="0.6">
    <line x1="80" y1="80" x2="160" y2="60"/>
    <line x1="80" y1="80" x2="110" y2="150"/>
    <line x1="160" y1="60" x2="210" y2="120"/>
    <line x1="110" y1="150" x2="180" y2="180"/>
    <line x1="180" y1="180" x2="260" y2="160"/>
    <line x1="80" y1="230" x2="140" y2="260"/>
    <line x1="140" y1="260" x2="220" y2="240"/>
  </g>

  <!-- CLUSTER 1: SIMILARIDADE LOCALIZADA (AMBER/ROSE - CARTEIRAS VIZINHAS) -->
  <g filter="url(#glowNode)">
    <!-- Polígono de delimitação do cluster -->
    <polygon points="340,70 470,60 480,180 350,170" fill="rgba(245,158,11,0.08)" stroke="#f59e0b" stroke-dasharray="4 2" stroke-width="1.2"/>
    <text x="410" y="52" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Cluster 1 (Fileira C • Carteiras 3 e 4)</text>

    <!-- Arestas fortes com coeficiente Dice -->
    <line x1="370" y1="100" x2="440" y2="90" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="370" y1="100" x2="390" y2="150" stroke="#f59e0b" stroke-width="2"/>
    <line x1="440" y1="90" x2="450" y2="150" stroke="#f59e0b" stroke-width="2"/>
    <line x1="390" y1="150" x2="450" y2="150" stroke="#f43f5e" stroke-width="3"/>

    <!-- Labels das arestas com % de Sorensen-Dice -->
    <rect x="390" y="86" width="32" height="15" rx="3" fill="#0f172a" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="406" y="97" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="8" font-weight="800" text-anchor="middle">88%</text>

    <rect x="405" y="142" width="34" height="15" rx="3" fill="#0f172a" stroke="#f43f5e" stroke-width="0.8"/>
    <text x="422" y="153" fill="#fb7185" font-family="'Inter', sans-serif" font-size="8" font-weight="800" text-anchor="middle">94%</text>

    <!-- Nós do Cluster -->
    <circle cx="370" cy="100" r="14" fill="url(#nodeAmber)"/>
    <text x="370" y="103" fill="#090e17" font-family="'Inter', sans-serif" font-size="8" font-weight="900" text-anchor="middle">C-14</text>

    <circle cx="440" cy="90" r="14" fill="url(#nodeAmber)"/>
    <text x="440" y="93" fill="#090e17" font-family="'Inter', sans-serif" font-size="8" font-weight="900" text-anchor="middle">C-15</text>

    <circle cx="390" cy="150" r="14" fill="url(#nodeAmber)"/>
    <text x="390" y="153" fill="#090e17" font-family="'Inter', sans-serif" font-size="8" font-weight="900" text-anchor="middle">C-22</text>

    <circle cx="450" cy="150" r="16" fill="url(#nodeRose)"/>
    <text x="450" y="153" fill="#ffffff" font-family="'Inter', sans-serif" font-size="8" font-weight="900" text-anchor="middle">C-23</text>
  </g>

  <!-- NÓS DISPERSOS REGULARES (VERDES / AZUIS - SEM SIMILARIDADE) -->
  <g>
    <circle cx="80" cy="80" r="12" fill="url(#nodeGreen)"/>
    <text x="80" y="83" fill="#090e17" font-family="'Inter', sans-serif" font-size="7.5" font-weight="800" text-anchor="middle">C-01</text>

    <circle cx="160" cy="60" r="12" fill="url(#nodeGreen)"/>
    <text x="160" y="63" fill="#090e17" font-family="'Inter', sans-serif" font-size="7.5" font-weight="800" text-anchor="middle">C-02</text>

    <circle cx="110" cy="150" r="12" fill="url(#nodeGreen)"/>
    <text x="110" y="153" fill="#090e17" font-family="'Inter', sans-serif" font-size="7.5" font-weight="800" text-anchor="middle">C-05</text>

    <circle cx="210" cy="120" r="12" fill="url(#nodeGreen)"/>
    <text x="210" y="123" fill="#090e17" font-family="'Inter', sans-serif" font-size="7.5" font-weight="800" text-anchor="middle">C-09</text>

    <circle cx="180" cy="180" r="12" fill="url(#nodeGreen)"/>
    <text x="180" y="183" fill="#090e17" font-family="'Inter', sans-serif" font-size="7.5" font-weight="800" text-anchor="middle">C-11</text>

    <circle cx="260" cy="160" r="12" fill="url(#nodeBlue)"/>
    <text x="260" y="163" fill="#ffffff" font-family="'Inter', sans-serif" font-size="7.5" font-weight="800" text-anchor="middle">C-18</text>

    <circle cx="80" cy="230" r="12" fill="url(#nodeGreen)"/>
    <text x="80" y="233" fill="#090e17" font-family="'Inter', sans-serif" font-size="7.5" font-weight="800" text-anchor="middle">C-30</text>

    <circle cx="140" cy="260" r="12" fill="url(#nodeGreen)"/>
    <text x="140" y="263" fill="#090e17" font-family="'Inter', sans-serif" font-size="7.5" font-weight="800" text-anchor="middle">C-35</text>

    <circle cx="220" cy="240" r="12" fill="url(#nodeGreen)"/>
    <text x="220" y="243" fill="#090e17" font-family="'Inter', sans-serif" font-size="7.5" font-weight="800" text-anchor="middle">C-42</text>
  </g>

  <!-- PAINEL LATERAL DIREITO COM MÉTRICAS & DIAGNÓSTICO -->
  <g transform="translate(515, 25)">
    <rect width="145" height="270" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    
    <text x="15" y="25" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="11" font-weight="800">AMPLITUDE N1</text>
    <text x="15" y="38" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9">76 Cadernos Manuscritos</text>

    <line x1="15" y1="48" x2="130" y2="48" stroke="#1e293b"/>

    <text x="15" y="68" fill="#34d399" font-family="'Inter', sans-serif" font-size="22" font-weight="900">78,9%</text>
    <text x="15" y="82" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="9" font-weight="600">60 Cadernos Regulares</text>
    <text x="15" y="94" fill="#64748b" font-family="'Inter', sans-serif" font-size="8">Sem anomalias de sintaxe</text>

    <line x1="15" y1="106" x2="130" y2="106" stroke="#1e293b"/>

    <text x="15" y="126" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="20" font-weight="900">5 Clusters</text>
    <text x="15" y="140" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="9" font-weight="600">Correlação Espacial</text>
    <text x="15" y="152" fill="#64748b" font-family="'Inter', sans-serif" font-size="8">Vizinhos de carteira</text>

    <line x1="15" y1="164" x2="130" y2="164" stroke="#1e293b"/>

    <rect x="10" y="174" width="125" height="85" rx="8" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.3)"/>
    <text x="18" y="190" fill="#34d399" font-family="'Inter', sans-serif" font-size="9" font-weight="800">Ação Pedagógica:</text>
    <text x="18" y="206" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="8">Questão 11(b):</text>
    <text x="18" y="218" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="7.5" font-style="italic">"na chamada"</text>
    <text x="18" y="234" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="8" font-weight="700">➔ Oficina de Prática</text>
    <text x="18" y="246" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="7.5">em vez de punição</text>
  </g>
</svg>
