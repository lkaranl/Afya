<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @page {
    size: A4 portrait;
    margin: 0;
  }
  body {
    margin: 0;
    padding: 0;
    width: 210mm;
    height: 297mm;
    font-family: "Times New Roman", Times, serif;
    position: relative;
    background: transparent;
  }
  .official-footer-wrapper {
    position: absolute;
    bottom: 12mm;
    left: 15mm;
    right: 15mm;
    width: 180mm;
  }
  .official-footer {
    border-top: 1.2pt solid #000000;
    border-bottom: 1.2pt solid #000000;
    padding: 4pt 0 4pt 0;
    font-size: 8.5pt;
    line-height: 1.25;
    text-align: left;
    color: #000000;
  }
  .official-footer .inst-name {
    margin: 0;
  }
  .official-footer-bottom {
    text-align: center;
    font-size: 8pt;
    font-style: italic;
    color: #000000;
    margin-top: 3pt;
  }
</style>
</head>
<body>
  <div class="official-footer-wrapper">
    <div class="official-footer">
      <div class="inst-name">Pró-Reitoria de Pós-Graduação, Pesquisa, Extensão, Empregabilidade, Inovação e Internacionalização (ProPPEXI)</div>
      <div class="inst-name">Afya Centro Universitário de Ji-Paraná</div>
    </div>
    <div class="official-footer-bottom">
      Anais do 12º Fórum Rondoniense de Pesquisa
    </div>
  </div>
</body>
</html>
