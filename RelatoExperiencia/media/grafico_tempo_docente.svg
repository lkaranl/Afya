<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="100%" height="auto">
    <defs>
    <linearGradient id="gradRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="gradBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <!-- Padrão de hachura para diferenciação perfeita em impressão Preto e Branco -->
    <pattern id="hatchManual" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#ffffff" stroke-width="1.8" opacity="0.3"/>
    </pattern>
    <filter id="subtleShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Linhas de grade horizontais -->
  <line x1="70" y1="230" x2="680" y2="230" stroke="#000000" stroke-width="1.2"/>
  <line x1="70" y1="185" x2="680" y2="185" stroke="#cbd5e1" stroke-dasharray="4"/>
  <line x1="70" y1="140" x2="680" y2="140" stroke="#cbd5e1" stroke-dasharray="4"/>
  <line x1="70" y1="95" x2="680" y2="95" stroke="#cbd5e1" stroke-dasharray="4"/>
  <line x1="70" y1="50" x2="680" y2="50" stroke="#cbd5e1" stroke-dasharray="4"/>

  <!-- Escala do eixo Y (minutos) -->
  <text x="60" y="234" font-family="'Times New Roman', serif" font-size="10" text-anchor="end">0m</text>
  <text x="60" y="189" font-family="'Times New Roman', serif" font-size="10" text-anchor="end">100m</text>
  <text x="60" y="144" font-family="'Times New Roman', serif" font-size="10" text-anchor="end">200m</text>
  <text x="60" y="99" font-family="'Times New Roman', serif" font-size="10" text-anchor="end">300m</text>
  <text x="60" y="54" font-family="'Times New Roman', serif" font-size="10" text-anchor="end">450m</text>

  <!-- Legenda Superior -->
  <rect x="230" y="15" width="16" height="12" fill="url(#gradRed)" rx="2"/>
  <text x="252" y="25" font-family="'Times New Roman', serif" font-size="10.5">Fluxo Tradicional (Manual)</text>
  <rect x="420" y="15" width="16" height="12" fill="url(#gradBlue)" rx="2"/>
  <text x="442" y="25" font-family="'Times New Roman', serif" font-size="10.5" font-weight="bold">Mediação MCP + Telegram</text>

  <!-- 1. Varredura de Prazos (45m vs 2m) -->
  <!-- 45m = 45 * 180 / 450 = 18px -->
  <rect x="100" y="212" width="38" height="18" fill="url(#gradRed)" rx="2"/>
  <text x="119" y="206" font-family="'Times New Roman', serif" font-size="9.5" text-anchor="middle">45m</text>
  <rect x="142" y="228" width="38" height="2" fill="url(#gradBlue)" rx="1"/>
  <text x="161" y="222" font-family="'Times New Roman', serif" font-size="9.5" font-weight="bold" fill="#1e40af" text-anchor="middle">2m</text>
  <text x="140" y="248" font-family="'Times New Roman', serif" font-size="10" text-anchor="middle">Varredura</text>
  <text x="140" y="260" font-family="'Times New Roman', serif" font-size="9" fill="#334155" text-anchor="middle">de Prazos</text>

  <!-- 2. Triagem e Download (90m vs 5m) -->
  <!-- 90m = 36px -->
  <rect x="215" y="194" width="38" height="36" fill="url(#gradRed)" rx="2"/>
  <text x="234" y="188" font-family="'Times New Roman', serif" font-size="9.5" text-anchor="middle">90m</text>
  <rect x="257" y="227" width="38" height="3" fill="url(#gradBlue)" rx="1"/>
  <text x="276" y="221" font-family="'Times New Roman', serif" font-size="9.5" font-weight="bold" fill="#1e40af" text-anchor="middle">5m</text>
  <text x="255" y="248" font-family="'Times New Roman', serif" font-size="10" text-anchor="middle">Triagem /</text>
  <text x="255" y="260" font-family="'Times New Roman', serif" font-size="9" fill="#334155" text-anchor="middle">Zips / Links</text>

  <!-- 3. Auditoria de Código (240m vs 40m) -->
  <!-- 240m = 96px -->
  <rect x="330" y="134" width="38" height="96" fill="url(#gradRed)" rx="2"/>
  <text x="349" y="128" font-family="'Times New Roman', serif" font-size="9.5" text-anchor="middle">240m</text>
  <rect x="372" y="214" width="38" height="16" fill="url(#gradBlue)" rx="2"/>
  <text x="391" y="208" font-family="'Times New Roman', serif" font-size="9.5" font-weight="bold" fill="#1e40af" text-anchor="middle">40m</text>
  <text x="370" y="248" font-family="'Times New Roman', serif" font-size="10" text-anchor="middle">Auditoria</text>
  <text x="370" y="260" font-family="'Times New Roman', serif" font-size="9" fill="#334155" text-anchor="middle">de Código</text>

  <!-- 4. Lançamento no Boletim (75m vs 3m) -->
  <!-- 75m = 30px -->
  <rect x="445" y="200" width="38" height="30" fill="url(#gradRed)" rx="2"/>
  <text x="464" y="194" font-family="'Times New Roman', serif" font-size="9.5" text-anchor="middle">75m</text>
  <rect x="487" y="228" width="38" height="2" fill="url(#gradBlue)" rx="1"/>
  <text x="506" y="222" font-family="'Times New Roman', serif" font-size="9.5" font-weight="bold" fill="#1e40af" text-anchor="middle">3m</text>
  <text x="485" y="248" font-family="'Times New Roman', serif" font-size="10" text-anchor="middle">Lançamento</text>
  <text x="485" y="260" font-family="'Times New Roman', serif" font-size="9" fill="#334155" text-anchor="middle">Boletim</text>

  <!-- 5. TEMPO TOTAL (450m = 7h30 vs 50m) -->
  <!-- 450m = 180px (y=50) -->
  <rect x="560" y="50" width="46" height="180" fill="url(#gradRed)" rx="3"/>
  <text x="583" y="44" font-family="'Times New Roman', serif" font-size="10" font-weight="bold" text-anchor="middle">450m (7h30)</text>
  <!-- 50m = 20px (y=210) -->
  <rect x="612" y="210" width="46" height="20" fill="url(#gradBlue)" rx="3"/>
  <text x="635" y="204" font-family="'Times New Roman', serif" font-size="10" font-weight="bold" fill="#1e40af" text-anchor="middle">50m (-89%)</text>
  <text x="609" y="248" font-family="'Times New Roman', serif" font-size="10" font-weight="bold" text-anchor="middle">TEMPO TOTAL</text>
  <text x="609" y="260" font-family="'Times New Roman', serif" font-size="9" fill="#1e40af" font-weight="bold" text-anchor="middle">Por Turma (70+)</text>
</svg>
